<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracing – Ela's Magic World</title>
<link rel="icon" href="bilder/ela-rund.png">
<link rel="stylesheet" href="schriften/schriften.css">

<style>
/* Nachspuren: links die Schreibfläche (Buchstabe mit Startpunkt, Nummern, Pfeilen), rechts der Bilderrahmen,
   in den nach dem Nachspuren das Bild hüpft (A: Apfel). Darunter Stifte, unten die ABC-Leiste. */
.top h1{color:var(--pink)}
.main{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.spur{display:grid;grid-template-columns:1fr minmax(150px,34%);gap:14px;align-items:center}
.flaeche{position:relative;background:#fffdf7;border-radius:20px;box-shadow:inset 0 0 0 3px var(--line)}
#cv{display:block;width:100%;height:clamp(280px,56vh,520px);touch-action:none;cursor:crosshair;border-radius:20px}
.formen{position:absolute;top:10px;left:12px;display:flex;gap:6px}
.formen i{font-style:normal;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;min-width:38px;text-align:center;
  padding:6px 8px;border-radius:12px;background:#fff;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.formen i.jetzt{background:var(--c);color:#fff;box-shadow:none}
.formen i.ok{background:var(--green);color:#fff;box-shadow:none}

/* Bilderrahmen: erst ein Fragezeichen, dann hüpft das Bild hinein */
.rahmen{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.rahmen .feld{position:relative;width:100%;aspect-ratio:1;border-radius:22px;background:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 5px #fff,0 0 0 9px var(--c,var(--orange)),0 14px 26px -16px rgba(90,30,110,.6)}
.rahmen .feld img{width:88%;height:88%;object-fit:contain;position:relative;z-index:2}
.rahmen .feld .frage{font-family:var(--display);font-weight:800;font-size:clamp(60px,9vw,96px);color:var(--line);line-height:1;animation:wackel 2.4s ease-in-out infinite}
@keyframes wackel{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.rahmen .wort{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.4vw,30px);line-height:1.05;color:var(--purple);min-height:1.1em}
.rahmen .wort b{color:var(--c)}
.rahmen .de{color:var(--muted);font-weight:800;font-size:15px;min-height:1.1em;margin-top:-4px}
.feld.tanz img{animation:tanz .9s ease 2}
@keyframes tanz{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.12)}75%{transform:rotate(12deg) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.rahmen .feld .frage,.feld.tanz img{animation:none}}

.werkzeug{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.stifte{display:flex;gap:8px;flex-wrap:wrap;flex:0 1 auto}
.knoepfe{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.stift{width:44px;height:44px;border-radius:50%;border:4px solid #fff;cursor:pointer;background:var(--c);box-shadow:0 0 0 2px var(--line)}
.stift.regenbogen{background:conic-gradient(#f05252,#f7882f,#fbbd23,#4cbb5c,#3d8ef0,#8b5cf6,#e8459b,#f05252)}
.stift[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.1)}
.btn.weiter{background:var(--green);color:#fff}
.btn.weiter.lockt{animation:lockt 1.1s ease-in-out infinite}
@keyframes lockt{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ABC-Leiste: am PC bunte Kacheln (2 Reihen à 13), am Handy ein ruhiges ABC-Band wie auf dem Arbeitsblatt
   (bunte Buchstaben, der aktuelle im farbigen Kreis, geschaffte mit Sternchen) */
.leiste{display:grid;grid-template-columns:repeat(13,1fr);gap:8px}
.leiste button{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(18px,2.6vw,26px);line-height:1;aspect-ratio:1;border:0;border-radius:14px;cursor:pointer;color:#fff;
  background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);padding:0}
.leiste button[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}
.leiste button.geschafft::after{content:"★";position:absolute;top:-8px;right:-6px;font-size:16px;color:var(--yellow);text-shadow:0 0 2px #b88400,0 1px 0 #b88400}
@media (max-width:560px){
  .leiste{gap:0;row-gap:8px}
  .leiste button{background:none;box-shadow:none;color:var(--c);border-radius:50%;font-size:21px;display:grid;place-items:center}
  .leiste button[aria-pressed="true"]{outline:0;background:var(--c);color:#fff;transform:scale(1.15);box-shadow:0 4px 10px -4px rgba(58,36,64,.5)}
  .leiste button.geschafft::after{top:auto;right:auto;bottom:-9px;left:50%;transform:translateX(-50%);font-size:12px}
}
/* Unsichtbares SVG zum Vermessen der Strich-Pfade */
#mess{position:absolute;width:0;height:0;overflow:hidden}
/* Handy: Bilderrahmen klein oben (Bild links, Wort rechts daneben), darunter die Schreibfläche in voller Breite */
@media (max-width:600px){
  .spur{grid-template-columns:1fr;gap:10px}
  .rahmen{order:-1;display:grid;grid-template-columns:96px 1fr;column-gap:14px;row-gap:2px;align-items:center;text-align:left;padding:6px 6px 0}
  .rahmen .feld{grid-row:span 2;width:96px;border-radius:16px;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--c,var(--orange))}
  .rahmen .feld .frage{font-size:52px}
  .rahmen .de{margin-top:0}
  #cv{height:clamp(300px,52vh,460px)}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-t="start"></span></a>
    <img class="logo" src="bilder/logo.png" alt="Ela's Magic World">
    <h1 data-t="t_schreiben"></h1>
    <div class="lang" id="lang"></div>
    <div class="stars" data-t-label="stars"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg><span id="stars-n">0</span></div>
  </header>

  <div class="main">
    <section class="card">
      <div class="spur">
        <div class="flaeche">
          <canvas id="cv" aria-label="Trace the letter"></canvas>
          <div class="formen" id="formen"><i id="f-gross">A</i><i id="f-klein">a</i></div>
        </div>
        <div class="rahmen" id="rahmen">
          <div class="feld" id="feld"><span class="frage" id="frage">?</span></div>
          <div class="wort" id="wort"></div>
          <div class="de" id="de"></div>
        </div>
      </div>
      <div class="werkzeug">
        <div class="stifte" id="stifte" data-t-label="tr_pen"></div>
        <div class="knoepfe">
        <button class="btn" id="nochmal" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg><span data-t="tr_again"></span></button>
        <button class="btn weiter" id="weiter" type="button"><span data-t="tr_next"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
    </section>
    <aside class="ela">
      <img class="round tippbar" id="ela-tipp" src="bilder/ela-rund.png" alt="Ela">
      <div class="bubble" id="bubble" role="status" data-t="tr_start"></div>
    </aside>
  </div>

  <section class="card">
    <div class="leiste" id="leiste" aria-label="Alphabet"></div>
  </section>
</div>
<svg id="mess" aria-hidden="true"><path id="mess-pfad"/></svg>

<script src="gemeinsam.js?v=50"></script>
<script src="daten.js?v=50"></script>
<script>
elaTippen(document.getElementById("ela-tipp"), ELA_VIDEOS.seite.abc);

/* ===== Schrift: jeder Buchstabe als Liste von Strichen (SVG-Pfade) in Schreib-Reihenfolge =====
   Koordinaten: 0 = obere Linie, 50 = Mittellinie, 100 = Grundlinie, 140 = Unterlänge.
   Ein Strich kürzer als 3 Einheiten ist ein Punkt (i, j) – den tippt man nur an. */
const SCHRIFT = {
  A: ["M40 0 L5 100", "M40 0 L75 100", "M19 64 L61 64"],
  B: ["M10 0 L10 100", "M10 0 L42 0 C70 0 70 50 42 50 L10 50", "M10 50 L46 50 C78 50 78 100 46 100 L10 100"],
  C: ["M74 18 A40 50 0 1 0 74 82"],
  D: ["M10 0 L10 100", "M10 0 L32 0 A42 50 0 0 1 32 100 L10 100"],
  E: ["M10 0 L10 100", "M10 0 L62 0", "M10 50 L52 50", "M10 100 L62 100"],
  F: ["M10 0 L10 100", "M10 0 L62 0", "M10 50 L52 50"],
  G: ["M74 18 A40 50 0 1 0 80 60", "M50 60 L80 60"],
  H: ["M10 0 L10 100", "M65 0 L65 100", "M10 50 L65 50"],
  I: ["M35 0 L35 100", "M12 0 L58 0", "M12 100 L58 100"],
  J: ["M55 0 L55 72 A25 26 0 0 1 5 74"],
  K: ["M10 0 L10 100", "M62 0 L10 58", "M27 40 L65 100"],
  L: ["M10 0 L10 100 L60 100"],
  M: ["M10 0 L10 100", "M10 0 L45 70 L80 0", "M80 0 L80 100"],
  N: ["M10 0 L10 100", "M10 0 L65 100", "M65 100 L65 0"],
  O: ["M42 0 A34 50 0 0 0 42 100 A34 50 0 0 0 42 0"],
  P: ["M10 0 L10 100", "M10 0 L38 0 A25 25 0 0 1 38 50 L10 50"],
  Q: ["M42 0 A34 50 0 0 0 42 100 A34 50 0 0 0 42 0", "M48 72 L76 104"],
  R: ["M10 0 L10 100", "M10 0 L38 0 A25 25 0 0 1 38 50 L10 50", "M32 50 L64 100"],
  S: ["M66 14 C58 -2 14 -6 14 24 C14 50 70 44 70 74 C70 106 18 106 8 84"],
  T: ["M37 0 L37 100", "M5 0 L70 0"],
  U: ["M10 0 L10 64 A28 36 0 0 0 66 64 L66 0"],
  V: ["M5 0 L37 100 L70 0"],
  W: ["M5 0 L25 100 L45 30 L65 100 L85 0"],
  X: ["M10 0 L65 100", "M65 0 L10 100"],
  Y: ["M10 0 L37 50", "M65 0 L37 50", "M37 50 L37 100"],
  Z: ["M10 0 L65 0 L10 100 L65 100"],
  a: ["M56.6 62.5 A25 25 0 1 0 60 75", "M60 50 L60 100"],
  b: ["M10 0 L10 100", "M10 75 A25 25 0 0 1 60 75 A25 25 0 0 1 10 75"],
  c: ["M57 62 A25 25 0 1 0 57 88"],
  d: ["M56.6 62.5 A25 25 0 1 0 60 75", "M60 0 L60 100"],
  e: ["M11 75 L59 75 A24 25 0 1 0 54 90"],
  f: ["M58 10 C50 -3 25 -3 25 22 L25 100", "M8 50 L46 50"],
  g: ["M56.6 62.5 A25 25 0 1 0 60 75", "M60 50 L60 118 C60 145 22 145 14 126"],
  h: ["M10 0 L10 100", "M10 74 C14 44 60 44 60 74 L60 100"],
  i: ["M30 50 L30 100", "M30 28 L30 28.5"],
  j: ["M40 50 L40 118 C40 144 10 144 4 124", "M40 28 L40 28.5"],
  k: ["M10 0 L10 100", "M52 50 L10 80", "M25 70 L55 100"],
  l: ["M30 0 L30 100"],
  m: ["M10 50 L10 100", "M10 74 C12 46 42 46 42 74 L42 100", "M42 74 C44 46 74 46 74 74 L74 100"],
  n: ["M10 50 L10 100", "M10 74 C12 46 58 46 58 74 L58 100"],
  o: ["M35 50 A25 25 0 0 0 35 100 A25 25 0 0 0 35 50"],
  p: ["M10 50 L10 140", "M10 75 A25 25 0 0 1 60 75 A25 25 0 0 1 10 75"],
  q: ["M56.6 62.5 A25 25 0 1 0 60 75", "M60 50 L60 140"],
  r: ["M10 50 L10 100", "M10 74 C14 48 40 46 55 56"],
  s: ["M54 58 C48 47 15 46 15 63 C15 78 55 72 55 87 C55 104 18 104 10 92"],
  t: ["M30 12 L30 100", "M10 50 L52 50"],
  u: ["M10 50 L10 78 A24 22 0 0 0 58 78", "M58 50 L58 100"],
  v: ["M8 50 L33 100 L58 50"],
  w: ["M5 50 L20 100 L37 62 L54 100 L69 50"],
  x: ["M10 50 L55 100", "M55 50 L10 100"],
  y: ["M8 50 L33 98", "M58 50 L18 140"],
  z: ["M10 50 L55 50 L10 100 L55 100"]
};

const BUNT = ["#f05252","#f7882f","#e5a50a","#4cbb5c","#3d8ef0","#8b5cf6","#e8459b"];
const farbe = L => BUNT[(L.charCodeAt(0) - 65) % BUNT.length];
const LETTERS = Object.keys(ABC_WOERTER);
const STIFTE = ["regenbogen", "#f05252", "#f7882f", "#fbbd23", "#4cbb5c", "#3d8ef0", "#8b5cf6", "#e8459b"];

/* ---------- Strich-Pfade vermessen: Punkte im Abstand von ca. 1,5 Einheiten ---------- */
const messPfad = document.getElementById("mess-pfad");
function abtasten(d){
  messPfad.setAttribute("d", d);
  const len = messPfad.getTotalLength(), n = Math.max(1, Math.ceil(len / 1.5)), pts = [];
  for (let i = 0; i <= n; i++) { const p = messPfad.getPointAtLength(len * i / n); pts.push({ x: p.x, y: p.y }); }
  return { pts, len, punkt: len < 3 };
}
/* Aufgabe = ein Buchstabe (groß oder klein), waagerecht auf 0 zentriert */
function aufgabe(z){
  const striche = SCHRIFT[z].map(abtasten);
  let min = Infinity, max = -Infinity;
  striche.forEach(s => s.pts.forEach(p => { min = Math.min(min, p.x); max = Math.max(max, p.x); }));
  const dx = -(min + max) / 2;
  striche.forEach((s, i) => { s.pts.forEach(p => p.x += dx); s.nr = i + 1; s.k = 0; s.fertig = false; s.farbe = null; });
  return { z, striche, breite: max - min, aktiv: 0, fertig: false };
}

/* ---------- Zustand ---------- */
let L = "A", form = 0, A = null, stift = store.get("ela-stift") || "regenbogen";
if (!STIFTE.includes(stift)) stift = "regenbogen";
let geschafft = (store.get("ela-spur-fertig") || "").split("").filter(x => LETTERS.includes(x));
let buchstabenFertig = 0;   // wie viele Buchstaben in diesem Besuch geschafft (für das seltene Lob)
let zugOk = false;   // zählt dieser Fingerzug? Nur wenn er am grünen Punkt (oder da, wo man aufgehört hat) beginnt
let zeigeStart = 0, finger = false, spur = [], funken = [], weiterTimer = null, gesprochen = false;

/* ---------- Zeichenfläche ---------- */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1, S = 1, ox = 0, oy = 0;
const Y_OBEN = -16, Y_UNTEN = 152, TOL = 17;   // sichtbarer Bereich (mit Unterlänge) und Toleranz in Einheiten
function groesse(){
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const breite = Math.max(110, (A ? A.breite : 80) + 60);
  S = Math.min(W / breite, H / (Y_UNTEN - Y_OBEN));
  ox = W / 2; oy = (H - (Y_UNTEN - Y_OBEN) * S) / 2 - Y_OBEN * S;
}
const einheit = () => ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * ox, dpr * oy);
function zuEinheit(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left - ox) / S, y: (e.clientY - r.top - oy) / S }; }

function linien(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const y = v => oy + v * S, links = 10, rechts = W - 10;
  // Bereich der kleinen Buchstaben ganz leicht gelb
  ctx.fillStyle = "rgba(251,189,35,.10)"; ctx.fillRect(links, y(50), rechts - links, 50 * S);
  const linie = (v, farbe, dash, breite) => {
    ctx.beginPath(); ctx.setLineDash(dash); ctx.strokeStyle = farbe; ctx.lineWidth = breite;
    ctx.moveTo(links, y(v)); ctx.lineTo(rechts, y(v)); ctx.stroke();
  };
  linie(0, "#c9b6f5", [], 2.5); linie(50, "#f3a6cc", [10, 8], 2); linie(100, "#c9b6f5", [], 2.5); linie(140, "#ece3f7", [6, 8], 1.5);
  ctx.setLineDash([]);
}
function polylinie(pts, bis){
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i <= bis; i++) ctx.lineTo(pts[i].x, pts[i].y);
}
const regenbogenFarbe = (i, nr) => `hsl(${(i * 2.4 + nr * 70) % 360} 88% 58%)`;
function malStrich(s, bis){
  if (s.punkt) { ctx.beginPath(); ctx.arc(s.pts[0].x, s.pts[0].y, 7, 0, 7); ctx.fillStyle = s.farbe === "regenbogen" ? regenbogenFarbe(0, s.nr) : s.farbe; ctx.fill(); return; }
  ctx.lineWidth = 12; ctx.lineCap = "round"; ctx.lineJoin = "round";
  if (s.farbe !== "regenbogen") { polylinie(s.pts, bis); ctx.strokeStyle = s.farbe; ctx.stroke(); return; }
  for (let i = 1; i <= bis; i++) {
    ctx.beginPath(); ctx.moveTo(s.pts[i - 1].x, s.pts[i - 1].y); ctx.lineTo(s.pts[i].x, s.pts[i].y);
    ctx.strokeStyle = regenbogenFarbe(i, s.nr); ctx.stroke();
  }
}
function stern(x, y, r, farbe, dreh = 0){
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const w = dreh - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    ctx.lineTo(x + Math.cos(w) * rr, y + Math.sin(w) * rr);
  }
  ctx.closePath(); ctx.fillStyle = farbe; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = "#fff"; ctx.stroke();
}
function pfeile(s){
  // kleine Pfeilspitzen entlang des aktuellen Strichs (Richtung!)
  const abstand = 26, schritt = s.len / (s.pts.length - 1);
  for (let d = 18; d < s.len - 12; d += abstand) {
    const i = Math.round(d / schritt); if (i <= s.k + 2) continue;
    const a = s.pts[Math.max(0, i - 2)], b = s.pts[Math.min(s.pts.length - 1, i + 2)];
    const w = Math.atan2(b.y - a.y, b.x - a.x), p = s.pts[i];
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(w);
    ctx.beginPath(); ctx.moveTo(-3.5, -4.5); ctx.lineTo(3, 0); ctx.lineTo(-3.5, 4.5);
    ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#fff"; ctx.stroke(); ctx.restore();
  }
}
function nummer(s, aktiv, t){
  const p = s.pts[0], r = aktiv ? 8.5 + Math.sin(t / 220) * 1.2 : 6;
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
  ctx.fillStyle = aktiv ? "#4cbb5c" : "#cdbfd9"; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.font = `800 ${aktiv ? 11 : 8.5}px "Baloo 2", Nunito, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(s.nr, p.x, p.y + .8);
}

function zeichnen(t){
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  linien(); if (!A) return;
  einheit();
  const s = A.striche[A.aktiv];
  // 1. Spur aller Striche: breite helle Straße mit gestrichelter Mitte
  A.striche.forEach((st, i) => {
    if (st.punkt) { ctx.beginPath(); ctx.arc(st.pts[0].x, st.pts[0].y, 7, 0, 7); ctx.fillStyle = "#efe6f7"; ctx.fill(); return; }
    polylinie(st.pts, st.pts.length - 1);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = 17; ctx.strokeStyle = (i === A.aktiv && !A.fertig) ? "#ffe0ef" : "#f3ecf8"; ctx.stroke();
    ctx.setLineDash([5, 5]); ctx.lineWidth = 2.4; ctx.strokeStyle = "#b9a7c7"; ctx.stroke(); ctx.setLineDash([]);
  });
  // 2. Fertige Striche und der Teil des aktuellen Strichs, der schon nachgespurt ist
  A.striche.forEach(st => { if (st.fertig) malStrich(st, st.pts.length - 1); });
  if (s && !A.fertig && s.k > 0) { s.farbe = stift; malStrich(s, s.k); }
  // 3. Eigene Fingerspur (dünn, durchsichtig) – damit man sieht, dass man malt
  if (spur.length > 1) {
    ctx.beginPath(); ctx.moveTo(spur[0].x, spur[0].y); spur.forEach(p => ctx.lineTo(p.x, p.y));
    ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "rgba(140,107,134,.35)"; ctx.stroke();
  }
  if (!A.fertig && s) {
    if (!s.punkt) pfeile(s);
    // Ziel-Sternchen am Ende des Strichs
    const ende = s.pts[s.pts.length - 1];
    if (!s.punkt) stern(ende.x, ende.y, 6, "#fbbd23", t / 900);
    // Nummern an den Startpunkten (aktueller Strich groß und grün)
    A.striche.forEach((st, i) => { if (!st.fertig && i !== A.aktiv) nummer(st, false, t); });
    nummer(s, true, t);
    // Kopf des Stifts beim Nachspuren
    if (s.k > 0) { const p = s.pts[s.k]; stern(p.x, p.y, 7.5, stift === "regenbogen" ? regenbogenFarbe(s.k, s.nr) : stift, t / 300); }
    // Glitzerstern zeigt den Weg vor: läuft vom Start zum Ziel (solange noch nicht angefangen)
    if (!finger && s.k < 3 && !s.punkt) {
      const dauer = Math.max(900, s.len * 22), pause = 700, lauf = Math.max(0, t - zeigeStart) % (dauer + pause);
      if (lauf < dauer) {
        const i = Math.round(lauf / dauer * (s.pts.length - 1)), p = s.pts[i];
        ctx.globalAlpha = .85; stern(p.x, p.y, 8, "#fbbd23", t / 250); ctx.globalAlpha = 1;
      }
    }
  }
  // 4. Funken (kleine Sterne), wenn ein Strich fertig ist
  funken = funken.filter(f => t - f.t0 < 900);
  funken.forEach(f => {
    const a = (t - f.t0) / 900;
    ctx.globalAlpha = 1 - a; stern(f.x + f.vx * a * 30, f.y + f.vy * a * 30, 4.5 * (1 - a * .5), f.c, a * 4); ctx.globalAlpha = 1;
  });
}
function schleife(t){ zeichnen(t); requestAnimationFrame(schleife); }

/* ---------- Nachspuren mit dem Finger ----------
   Fortschritt k wandert nur vorwärts entlang des Strichs, und nur wenn der Finger nah an den nächsten Punkten ist.
   So muss man am Startpunkt anfangen und der Richtung folgen – ein falscher Weg zählt einfach nicht (keine Strafe). */
const VORAUS = 16;   // so viele Punkte darf der Finger vorausspringen (ca. 24 Einheiten)
function bewegt(p){
  const s = A && A.striche[A.aktiv]; if (!s || A.fertig) return;
  if (s.punkt) { if (Math.hypot(p.x - s.pts[0].x, p.y - s.pts[0].y) < TOL * 1.4) strichFertig(s); return; }
  if (!zugOk) return;
  let best = s.k;
  for (let j = s.k; j <= Math.min(s.k + VORAUS, s.pts.length - 1); j++)
    if (Math.hypot(p.x - s.pts[j].x, p.y - s.pts[j].y) < TOL) best = j;
  s.k = best;
  if (s.k >= s.pts.length - 3) { s.k = s.pts.length - 1; strichFertig(s); }
}
cv.addEventListener("pointerdown", e => {
  e.preventDefault(); cv.setPointerCapture(e.pointerId); finger = true; spur = [];
  ton(0); const p = zuEinheit(e); spur.push(p);
  const s = A && A.striche[A.aktiv];
  const nah = q => Math.hypot(p.x - q.x, p.y - q.y) < TOL * 1.4;
  zugOk = !!s && (s.punkt || nah(s.pts[s.k]) || nah(s.pts[0]));
  bewegt(p);
});
cv.addEventListener("pointermove", e => {
  if (!finger) return;
  const liste = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  (liste.length ? liste : [e]).forEach(ev => { const p = zuEinheit(ev); spur.push(p); bewegt(p); });
  if (spur.length > 400) spur = spur.slice(-400);
});
const los = () => { finger = false; zugOk = false; spur = []; zeigeStart = performance.now(); };
cv.addEventListener("pointerup", los); cv.addEventListener("pointercancel", los);

/* Kleiner "Pling" (im Browser erzeugt, nichts wird nachgeladen) */
let audio = null;
function ton(art){
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    if (!art) return;
    const noten = art === 2 ? [784, 988, 1175, 1568] : [880, 1320];
    noten.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * .09;
      o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(.08, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .25);
      o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + .3);
    });
  } catch(e){}
}

function strichFertig(s){
  s.fertig = true; s.farbe = stift; spur = []; zugOk = false;   // für den nächsten Strich neu am grünen Punkt aufsetzen
  const ende = s.pts[s.pts.length - 1], t0 = performance.now();
  for (let i = 0; i < 9; i++) { const w = i / 9 * Math.PI * 2; funken.push({ x: ende.x, y: ende.y, vx: Math.cos(w), vy: Math.sin(w), c: zufall(BUNT), t0 }); }
  A.aktiv++; zeigeStart = performance.now();
  if (A.aktiv >= A.striche.length) formFertig(); else ton(1);
}

/* ---------- Ablauf: großer Buchstabe → kleiner Buchstabe → Bild hüpft in den Rahmen ---------- */
const karte = Lx => karten(Lx).find(k => k.bild) || karten(Lx)[0];
function formFertig(){
  A.fertig = true; ton(2);
  const k = karte(L), en = k.wort.en;
  if (form === 0) {
    // Großer Buchstabe geschafft: das Bild hüpft in den Rahmen
    bildHuepft(k);
    // Ela sagt nur das Wort ("Apple!") – kein Lob, sonst lobt sie bei jedem Buchstaben zweimal
    say(`${en}! ${t("tr_small", { l: L.toLowerCase() })}`);
    if (STIMMEN.wort[L] && k.wort === ABC_WOERTER[L]) elaSagt([STIMMEN.wort[L]], `${en}!`);
    else speak(`${en}!`, "en-US");
    setTimeout(() => { form = 1; neu(); }, 2200);
  } else {
    // Kleiner Buchstabe geschafft: "Yes! A is for Apple", Bild tanzt, Stern
    document.getElementById("f-klein").className = "ok";
    const feld = document.getElementById("feld"); feld.classList.remove("tanz"); void feld.offsetWidth; feld.classList.add("tanz");
    // "A is for Apple!" – ein Lob ("You are so smart!") nur bei jedem dritten Buchstaben, sonst wird es zu viel
    const mitLob = ++buchstabenFertig % 3 === 0, satz = `${L} is for ${en}!`;
    say(mitLob ? `${lob()} ${t("a_is", { L, w: en })}` : t("a_is", { L, w: en }));
    const abc = STIMMEN.abc[L] && k.wort === ABC_WOERTER[L] ? STIMMEN.abc[L] : "";
    if (mitLob) elaKette([{ datei: zufall(STIMMEN.lob), text: lob() }, { datei: abc, text: satz }]);
    else if (abc) elaSagt([abc], satz);
    else speak(satz, "en-US");
    sternDazu(); sternRegen();
    if (!geschafft.includes(L)) { geschafft.push(L); store.set("ela-spur-fertig", geschafft.join("")); }
    leiste();
    document.getElementById("weiter").classList.add("lockt");
    clearTimeout(weiterTimer); weiterTimer = setTimeout(naechster, 6000);
  }
}
function bildHuepft(k){
  const feld = document.getElementById("feld"), wort = document.getElementById("wort");
  feld.innerHTML = "";
  wort.innerHTML = `<b>${L}</b> is for <b>${k.wort.en}</b>`;
  document.getElementById("de").textContent = MENU === "en" ? "" : txm(k.wort);
  const img = document.createElement(k.bild ? "img" : "span");
  if (k.bild) { img.src = k.bild; img.alt = k.wort.en; }
  else { img.className = "frage"; img.style.cssText = "color:var(--c);animation:none;font-size:clamp(40px,6vw,64px)"; img.textContent = k.wort.en; }
  feld.appendChild(img);
  // Sprung vom Buchstaben (Mitte der Schreibfläche) in drei Hüpfern in den Rahmen
  const a = cv.getBoundingClientRect(), b = feld.getBoundingClientRect();
  const dx = (a.left + a.width / 2) - (b.left + b.width / 2), dy = (a.top + a.height / 2) - (b.top + b.height / 2);
  if (img.animate && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    img.animate([
      { transform: `translate(${dx}px,${dy}px) scale(.25)`, opacity: 0 },
      { transform: `translate(${dx * .7}px,${dy * .7 - 110}px) scale(.45)`, opacity: 1, offset: .22 },
      { transform: `translate(${dx * .42}px,${dy * .42}px) scale(.55)`, offset: .44 },
      { transform: `translate(${dx * .2}px,${dy * .2 - 70}px) scale(.7)`, offset: .64 },
      { transform: `translate(0,0) scale(1.18)`, offset: .84 },
      { transform: `translate(0,0) scale(1)` }
    ], { duration: 1300, easing: "ease-in-out" });
  }
}
function rahmenLeer(){
  document.getElementById("feld").innerHTML = '<span class="frage">?</span>';
  document.getElementById("wort").textContent = ""; document.getElementById("de").textContent = "";
}
function neu(){
  clearTimeout(weiterTimer);
  A = aufgabe(form === 0 ? L : L.toLowerCase());
  groesse(); zeigeStart = performance.now(); spur = [];
  const gross = document.getElementById("f-gross"), klein = document.getElementById("f-klein");
  gross.textContent = L; klein.textContent = L.toLowerCase();
  gross.className = form === 0 ? "jetzt" : "ok"; klein.className = form === 1 ? "jetzt" : "";
  document.getElementById("weiter").classList.remove("lockt");
}
function waehle(Lx, laut){
  L = Lx; form = 0; store.set("ela-spur-L", L);
  document.querySelector(".card").style.setProperty("--c", farbe(L));
  document.getElementById("rahmen").style.setProperty("--c", farbe(L));
  document.getElementById("formen").style.setProperty("--c", farbe(L));
  rahmenLeer(); neu(); leiste();
  say(t("tr_big", { L }));
  if (laut) sagBuchstabe();
}
function sagBuchstabe(){
  // "Let's trace … A" – "Let's trace" nur mit Elas Aufnahme (STIMMEN.spuren), damit keine zwei Stimmen gemischt werden
  const teile = [];
  if (STIMMEN.spuren) teile.push({ datei: STIMMEN.spuren, text: "Let's trace" });
  teile.push({ datei: STIMMEN.buchstabe[L] || "", text: L });
  elaKette(teile);
}
function naechster(){
  const i = LETTERS.indexOf(L);
  waehle(LETTERS[(i + 1) % LETTERS.length], true);
}

/* ---------- Knöpfe ---------- */
document.getElementById("nochmal").onclick = () => { if (form === 1 && A.fertig) form = 1; neu(); };
document.getElementById("weiter").onclick = naechster;
const stifte = document.getElementById("stifte");
STIFTE.forEach(f => {
  const b = document.createElement("button"); b.type = "button"; b.className = "stift" + (f === "regenbogen" ? " regenbogen" : "");
  if (f !== "regenbogen") b.style.setProperty("--c", f);
  b.setAttribute("aria-label", f === "regenbogen" ? tm("tr_rainbow") : f);
  b.setAttribute("aria-pressed", f === stift);
  b.onclick = () => { stift = f; store.set("ela-stift", f); [...stifte.children].forEach(x => x.setAttribute("aria-pressed", x === b)); };
  stifte.appendChild(b);
});
function leiste(){
  const box = document.getElementById("leiste");
  if (!box.children.length) LETTERS.forEach(Lx => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = Lx; b.dataset.l = Lx;
    b.style.setProperty("--c", farbe(Lx)); b.setAttribute("aria-label", Lx);
    b.onclick = () => waehle(Lx, true);
    box.appendChild(b);
  });
  [...box.children].forEach(b => {
    b.setAttribute("aria-pressed", b.dataset.l === L);
    b.classList.toggle("geschafft", geschafft.includes(b.dataset.l));
  });
}
new ResizeObserver(() => groesse()).observe(cv);

const start = store.get("ela-spur-L");
waehle(LETTERS.includes(start) ? start : "A", false);
requestAnimationFrame(schleife);
</script>
