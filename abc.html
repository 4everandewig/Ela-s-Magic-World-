<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABC – Ela's Magic World</title>
<link rel="icon" href="bilder/ela-rund.png">
<link rel="stylesheet" href="schriften/schriften.css">
<link rel="stylesheet" href="gemeinsam.css">
<style>
/* ABC: Tabs Entdecken/Spielen; links die große Buchstabenkarte bzw. das Rätsel, rechts Ela; darunter das Buchstaben-Raster */
.top h1{color:var(--purple)}
.main{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.big{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.big .letter{font-family:var(--display);font-weight:800;font-size:clamp(90px,16vw,170px);line-height:.9;color:var(--c,var(--orange))}
.big .bild{width:min(420px,100%);aspect-ratio:16/10;display:grid;place-items:center}
.big .bild img{max-width:100%;max-height:100%}
.big .word{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,52px);line-height:1;color:var(--purple)}
.big .de{color:var(--muted);font-weight:800;font-size:18px}
.speaker{background:var(--yellow);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.grid button{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;aspect-ratio:1;border:0;border-radius:18px;cursor:pointer;color:#fff;
  background:var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.15);padding:0}
.grid button[aria-pressed="true"]{outline:4px solid var(--ink);outline-offset:2px}

.q{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);color:var(--purple);text-align:center;margin:0}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
.choice{border:0;border-radius:22px;cursor:pointer;background:var(--bg);box-shadow:inset 0 -6px 0 rgba(0,0,0,.08);padding:10px;display:grid;place-items:center;min-height:120px}
.choice.l{font-family:var(--display);font-weight:800;font-size:clamp(56px,10vw,90px);line-height:1;color:#fff;background:var(--c)}
.choice img{max-width:100%;max-height:150px}
.choice.ok{background:var(--green);color:#fff}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-t="start"></span></a>
    <img class="logo" src="bilder/logo.png" alt="Ela's Magic World">
    <h1>ABC</h1>
    <div class="lang" id="lang"></div>
    <div class="stars" data-t-label="stars"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg><span id="stars-n">0</span></div>
  </header>

  <div class="tabs">
    <button class="tab" id="tab-lernen" type="button" style="--c:var(--pink)" aria-pressed="true" data-t="explore"></button>
    <button class="tab" id="tab-spiel" type="button" style="--c:var(--purple)" aria-pressed="false" data-t="play"></button>
  </div>

  <div class="main">
    <section class="card">
      <!-- Entdecken -->
      <div id="lernen">
        <div class="big" id="karte">
          <div class="letter" id="k-letter">Aa</div>
          <div class="bild" id="k-bild"></div>
          <div class="word" id="k-word">Apple</div>
          <div class="de" id="k-de">Apfel</div>
          <button class="btn speaker" id="k-say" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span data-t="hear"></span></button>
        </div>
      </div>
      <!-- Spielen -->
      <div id="spiel" hidden>
        <div class="big" style="gap:14px">
          <p class="q" id="frage"></p>
          <div class="bild" id="s-bild"></div>
          <div class="letter" id="s-letter" hidden></div>
          <div class="choices" id="choices"></div>
          <button class="btn speaker" id="s-say" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span data-t="hear_q"></span></button>
        </div>
      </div>
    </section>
    <aside class="ela">
      <img class="round tippbar" id="ela-tipp" src="bilder/ela-rund.png" alt="Ela">
      <div class="bubble" id="bubble" role="status" data-t="a_tap"></div>
    </aside>
  </div>

  <section class="card" id="raster-box">
    <div class="grid" id="raster" aria-label="Alphabet"></div>
  </section>
</div>

<script src="gemeinsam.js"></script>
<script src="daten.js"></script>
<script>
/* Auf Ela tippen: ihre Videos der Reihe nach */
elaTippen(document.getElementById("ela-tipp"), ELA_VIDEOS.seite.abc);
const BUNT = ["#f05252","#f7882f","#e5a50a","#4cbb5c","#3d8ef0","#8b5cf6","#e8459b"];
const farbe = L => BUNT[(L.charCodeAt(0) - 65) % BUNT.length];
const LETTERS = Object.keys(ABC_WOERTER);

/* ---------- Entdecken ---------- */
const raster = document.getElementById("raster");
LETTERS.forEach(L => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = L; b.id = "abc-" + L;
  b.style.setProperty("--c", farbe(L)); b.setAttribute("aria-label", L);
  b.onclick = () => zeige(L, true);
  raster.appendChild(b);
});
let aktuell = "A", nr = 0, karteJetzt = null;
// Nochmal auf denselben Buchstaben tippen = nächste Karte (z. B. B: Bear → Bat)
function zeige(L, laut){
  nr = (L === aktuell && laut) ? nr + 1 : 0;
  aktuell = L;
  const alle = karten(L), k = alle[nr % alle.length], en = k.wort.en;
  karteJetzt = k;
  const karte = document.getElementById("karte"); karte.style.setProperty("--c", farbe(L));
  document.getElementById("k-letter").textContent = L + L.toLowerCase();
  document.getElementById("k-word").textContent = en;
  document.getElementById("k-de").textContent = LANG === "en" ? "" : tx(k.wort);
  document.getElementById("k-bild").innerHTML = k.bild ? `<img src="${k.bild}" alt="${en}">` : "";
  [...raster.children].forEach(b => b.setAttribute("aria-pressed", b.id === "abc-" + L));
  store.set("ela-abc", L);
  if (laut) { sprich(L, k); say(t(k.bild ? "a_is" : "a_nopic", { L, w: en })); }
}
function sprich(L, k){
  const en = k.wort.en, ersatz = `${L}. ${L} is for ${en}.`;
  const hauptwort = k.wort === ABC_WOERTER[L];   // Elas Aufnahmen gehören zum ABC-Hauptwort ("K is for Kite")
  if (ELA_VIDEOS.abc[en]) return elaVideo(ELA_VIDEOS.abc[en], ersatz);   // Ela im Video: "P is for Pumpkin"
  // Elas echte Stimme, wenn möglich mit "Can you say it with me?" und dem Wort zum Nachsprechen
  if (hauptwort && STIMMEN.abc[L]) elaSagt(STIMMEN.wort[L] ? [STIMMEN.abc[L], STIMMEN.mitsprechen, STIMMEN.wort[L]] : [STIMMEN.abc[L]], ersatz);
  else if (STIMMEN.buchstabe[L]) elaSagt([STIMMEN.buchstabe[L]], ersatz, `${L} is for ${en}.`);
  else speak(ersatz, "en-US");
}
document.getElementById("k-say").onclick = () => sprich(aktuell, karteJetzt);

/* ---------- Spielen ---------- */
// Zwei Rätselarten: Bild zeigen -> Buchstabe wählen, oder Buchstabe zeigen -> Bild wählen
// Spielbar sind alle Buchstaben mit Bild (Foto oder Ausmalbild); pro Runde wird je Buchstabe eine Karte gewählt
const MIT_BILD = LETTERS.filter(L => karten(L).some(k => k.bild));
const bildKarte = L => zufall(karten(L).filter(k => k.bild));
let richtig = null, art = 0, sperre = false, gewaehlt = {};
const mischen = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
function neueFrage(){
  sperre = false; gewaehlt = {};
  richtig = zufall(MIT_BILD.filter(L => L !== richtig));
  gewaehlt[richtig] = bildKarte(richtig);
  // Drei Rätselarten: 0 = Bild → Buchstabe, 1 = Buchstabe → Bild, 2 = "Find the letter G!" (nur wo Elas Aufnahme da ist)
  const arten = MIT_BILD.length >= 3 ? [0, 1] : [0];
  if (STIMMEN.finde[richtig] && LANG === "en") arten.push(2);
  art = zufall(arten);
  const choices = document.getElementById("choices"); choices.innerHTML = "";
  const sBild = document.getElementById("s-bild"), sLetter = document.getElementById("s-letter");
  if (art === 2) {
    document.getElementById("frage").textContent = t("a_q3", { L: richtig });
    sBild.hidden = true; sLetter.hidden = true;
    const opts = mischen([richtig, ...mischen(LETTERS.filter(L => L !== richtig)).slice(0, 2)]);
    opts.forEach(L => {
      const b = document.createElement("button"); b.type = "button"; b.className = "choice l";
      b.style.setProperty("--c", farbe(L)); b.textContent = L + L.toLowerCase(); b.setAttribute("aria-label", L);
      b.onclick = () => antwort(b, L); choices.appendChild(b);
    });
  } else if (art === 0) {
    document.getElementById("frage").textContent = t("a_q1");
    sBild.hidden = false; sLetter.hidden = true;
    sBild.innerHTML = `<img src="${gewaehlt[richtig].bild}" alt="?">`;
    const opts = mischen([richtig, ...mischen(LETTERS.filter(L => L !== richtig)).slice(0, 2)]);
    opts.forEach(L => {
      const b = document.createElement("button"); b.type = "button"; b.className = "choice l";
      b.style.setProperty("--c", farbe(L)); b.textContent = L; b.setAttribute("aria-label", L);
      b.onclick = () => antwort(b, L); choices.appendChild(b);
    });
  } else {
    document.getElementById("frage").textContent = t("a_q2", { L: richtig });
    sBild.hidden = true; sLetter.hidden = false;
    sLetter.textContent = richtig + richtig.toLowerCase(); sLetter.parentElement.style.setProperty("--c", farbe(richtig));
    const opts = mischen([richtig, ...mischen(MIT_BILD.filter(L => L !== richtig)).slice(0, 2)]);
    opts.forEach(L => {
      const b = document.createElement("button"); b.type = "button"; b.className = "choice";
      if (!gewaehlt[L]) gewaehlt[L] = bildKarte(L);
      b.innerHTML = `<img src="${gewaehlt[L].bild}" alt="${gewaehlt[L].wort.en}">`;
      b.onclick = () => antwort(b, L); choices.appendChild(b);
    });
  }
  frageVorlesen();
}
function frageVorlesen(){
  const text = art === 0 ? t("a_q1") : art === 1 ? t("a_q2", { L: richtig }) : t("a_q3", { L: richtig });
  if (art === 1 && LANG === "en" && STIMMEN.frage[richtig]) elaSagt([STIMMEN.frage[richtig]], text);   // "What starts with G?"
  else if (art === 2 && STIMMEN.finde[richtig]) elaSagt([STIMMEN.finde[richtig]], text);              // "Find the letter G!"
  else speak(text);
}
function antwort(btn, L){
  if (sperre) return;
  if (L === richtig) {
    sperre = true; btn.classList.add("ok", "yay");
    const k = gewaehlt[L], en = k.wort.en;
    say(`${lob()} ${t("a_is", { L, w: en })}`);
    // "Yes!" / "You did it!" mit Elas Stimme, dann "B is for Bat!"
    if (STIMMEN.abc[L] && k.wort === ABC_WOERTER[L]) elaSagt([zufall(STIMMEN.lob), STIMMEN.abc[L]], `${L} is for ${en}!`);
    else elaSagt([zufall(STIMMEN.lob)], `${L} is for ${en}!`, `${L} is for ${en}!`);
    sternDazu(); sternRegen();
    setTimeout(neueFrage, 3000);
  } else {
    btn.classList.remove("wiggle"); void btn.offsetWidth; btn.classList.add("wiggle");
    say(nochmal());
    if (LANG === "en") elaSagt([STIMMEN.denken]);   // "Think, think, think!"
  }
}
document.getElementById("s-say").onclick = frageVorlesen;

/* ---------- Tabs ---------- */
function modus(m){
  document.getElementById("tab-lernen").setAttribute("aria-pressed", m === "lernen");
  document.getElementById("tab-spiel").setAttribute("aria-pressed", m === "spiel");
  document.getElementById("lernen").hidden = m !== "lernen";
  document.getElementById("spiel").hidden = m !== "spiel";
  document.getElementById("raster-box").hidden = m !== "lernen";
  if (m === "spiel") { say(t("a_play")); neueFrage(); }
  else say(t("a_tap"));
}
document.getElementById("tab-lernen").onclick = () => modus("lernen");
document.getElementById("tab-spiel").onclick = () => modus("spiel");

zeige(store.get("ela-abc") || "A", false);
</script>
</body>
</html>
