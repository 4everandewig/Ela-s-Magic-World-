<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic Doors – Ela's Magic World</title>
<link rel="icon" href="bilder/ela-rund.png">
<link rel="stylesheet" href="schriften/schriften.css">
<link rel="stylesheet" href="gemeinsam.css?v=68">
<style>
/* Zaubertüren (aus "Ela & Papa", Episode 1): drei Türen in Rot, Gelb, Blau, hinter jeder ein Tier aus dem ABC (3D-Bilder).
   Ela: "Who is hiding? Find the Bear!" – oben sieht man klein, wer gesucht wird (auch für Kinder, die noch nicht lesen). */
.top h1{color:var(--purple)}
.main{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}.main .ela{order:-1}}
.q{font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,36px);color:var(--ink);margin:0 0 14px;text-align:center;
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.q img{width:clamp(56px,12vw,76px);aspect-ratio:1;object-fit:cover;border-radius:16px;box-shadow:0 0 0 4px var(--yellow)}
.tueren{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3vw,24px);align-items:end}
/* Die drei Zaubertüren sind freigestellte 3D-Bilder (bilder/tueren/). Dahinter warmes Licht in genau der Türform (Maske = Türbild). */
.tuer{position:relative;border:0;padding:0;background:none;cursor:pointer;width:100%;aspect-ratio:var(--ar);perspective:1000px}
.tuer .dahinter{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fffbe6,#ffe08a 55%,#f7c35c);
  -webkit-mask:var(--bild) center/100% 100% no-repeat;mask:var(--bild) center/100% 100% no-repeat;display:grid;place-items:center}
.tuer .dahinter img{width:72%;aspect-ratio:1;object-fit:cover;border-radius:16px;box-shadow:0 6px 14px -8px rgba(90,50,30,.6)}
.tuer .blatt{position:absolute;inset:0;width:100%;height:100%;transform-origin:left center;transition:transform .8s ease;
  filter:drop-shadow(0 10px 12px rgba(58,36,64,.35))}
.tuer.rechts .blatt{transform-origin:right center}
.tuer.offen .blatt{transform:rotateY(-100deg)}
.tuer.rechts.offen .blatt{transform:rotateY(100deg)}
.tuer:focus-visible{outline:3px solid var(--orange);outline-offset:4px;border-radius:20px}
.tuer.wackel{animation:wiggle .4s ease}
.tuer.richtig .dahinter img{box-shadow:0 0 0 5px var(--green)}
.leiste{display:flex;justify-content:center;margin-top:16px}
.nochmal{background:var(--purple);color:#fff}
@media (prefers-reduced-motion:reduce){.tuer .blatt{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-t="start"></span></a>
    <img class="logo" src="bilder/logo.png" alt="Ela's Magic World">
    <h1 data-t="t_tueren"></h1>
    <div class="lang" id="lang"></div>
    <div class="stars" data-t-label="stars"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg><span id="stars-n">0</span></div>
  </header>

  <div class="main">
    <section class="card">
      <p class="q" id="frage"><img id="ziel" alt=""><span id="frage-text"></span></p>
      <div class="tueren" id="tueren"></div>
      <div class="leiste"><button class="btn nochmal" id="nochmal" type="button" hidden data-t="d_again"></button></div>
    </section>
    <aside class="ela">
      <img class="round tippbar" id="ela-tipp" src="bilder/ela-rund.png" alt="Ela">
      <div class="bubble" id="bubble" role="status"></div>
    </aside>
  </div>
</div>

<script src="gemeinsam.js?v=68"></script>
<script src="daten.js?v=68"></script>
<script>
// Red, yellow and blue! – Bild, Seitenverhältnis, Scharnier-Seite (die gelbe Tür hat den Griff links)
const TUEREN = [{ bild: "bilder/tueren/tuer-rot.webp",  ar: "465/720", rechts: false },
                { bild: "bilder/tueren/tuer-gelb.webp", ar: "558/720", rechts: true },
                { bild: "bilder/tueren/tuer-blau.webp", ar: "450/720", rechts: false }];
const mischen = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const TIERE = Object.keys(ABC_WOERTER).filter(L => ABC_WOERTER[L].foto);
const S = STIMMEN.tueren, EN = () => LANG === "en";
let ziel = null, letztes = null, fertig = false;
const tueren = document.getElementById("tueren");
const wortVon = L => EN() ? ABC_WOERTER[L].en : tx(ABC_WOERTER[L]);

function neueRunde(){
  fertig = false;
  document.getElementById("nochmal").hidden = true;
  const drei = mischen(TIERE.filter(L => L !== letztes)).slice(0, 3);
  ziel = zufall(drei); letztes = ziel;
  const w = ABC_WOERTER[ziel];
  document.getElementById("ziel").src = w.foto;
  document.getElementById("frage-text").textContent = t("d_find", { w: wortVon(ziel) });
  tueren.innerHTML = "";
  drei.forEach((L, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "tuer";
    const tuer = TUEREN[i];
    b.style.setProperty("--bild", `url("${tuer.bild}")`); b.style.setProperty("--ar", tuer.ar);
    if (tuer.rechts) b.classList.add("rechts");
    b.setAttribute("aria-label", "Door " + (i + 1));
    b.innerHTML = `<span class="dahinter"><img src="${ABC_WOERTER[L].foto}" alt="${ABC_WOERTER[L].en}"></span><img class="blatt" src="${tuer.bild}" alt="">`;
    b.onclick = () => oeffnen(b, L);
    tueren.appendChild(b);
  });
  frageSagen();
}

/* "Who is hiding? Find the Bear!" – mit Elas Stimme, sobald die Aufnahme da ist ("Find the Bear!"),
   sonst "Who is hiding?" + Elas Wort ("Bear") bzw. die Geräte-Stimme */
function frageSagen(){
  say(t("d_find", { w: wortVon(ziel) }));
  if (!EN()) return speak(t("d_find", { w: wortVon(ziel) }));
  const en = ABC_WOERTER[ziel].en;
  if (S.tier[ziel]) elaKette([{ datei: S.wer, text: "Who is hiding?" }, { datei: S.tier[ziel], text: `Find the ${en}!` }]);
  else if (STIMMEN.wort[ziel]) elaKette([{ datei: S.wer, text: "Who is hiding?" }, { datei: STIMMEN.wort[ziel], text: en }]);
  else elaKette([{ datei: S.wer, text: "Who is hiding?" }, { text: `Find the ${en}!` }]);
}
document.getElementById("frage").onclick = frageSagen;

function oeffnen(b, L){
  if (fertig || b.classList.contains("offen")) return;
  b.classList.add("offen");
  const en = ABC_WOERTER[L].en;
  if (L === ziel) {
    fertig = true; b.classList.add("richtig");
    say(`${lob()} ${t("d_right", { w: wortVon(L) })}`);
    // "You found it!" – "B is for Bear!"
    if (EN()) elaKette([{ datei: S.gefunden, text: "You found it!" }, { datei: STIMMEN.abc[L], text: `${L} is for ${en}!` }]);
    else speak(`${lob()} ${t("d_right", { w: wortVon(L) })}`);
    sternDazu(); sternRegen();
    // alle Türen aufmachen, damit man sieht, wer sich noch versteckt hat
    setTimeout(() => [...tueren.children].forEach(x => x.classList.add("offen")), 1400);
    setTimeout(() => { document.getElementById("nochmal").hidden = false; }, 1900);
  } else {
    // ein anderes Tier: "G is for Giraffe! Try another door." – sanft, nie bestrafen
    say(t("d_wrong", { L, w: wortVon(L) }));
    if (EN()) elaKette([{ datei: STIMMEN.abc[L], text: `${L} is for ${en}!` }, { datei: S.andere, text: "Try another door!" }]);
    else speak(t("d_wrong", { L, w: wortVon(L) }));
  }
}

document.getElementById("nochmal").onclick = neueRunde;
/* Auf Ela tippen: "Open a door!" (solange noch gesucht wird), danach die Frage nochmal */
document.getElementById("ela-tipp").onclick = () => {
  if (fertig || !EN()) return frageSagen();
  say(t("d_find", { w: wortVon(ziel) }));
  elaKette([{ datei: S.oeffne, text: "Open a door!" }]);
};
neueRunde();
</script>
</body>
</html>
