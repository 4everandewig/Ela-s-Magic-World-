<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ela's Magic World</title>
<link rel="icon" href="bilder/ela-rund.png">
<link rel="stylesheet" href="schriften/schriften.css">
<link rel="stylesheet" href="gemeinsam.css?v=73">
<style>
/* Startseite: Intro-Video, dann Elas Zimmer mit Logo, Ela (mit Begrüßung), darunter große bunte Kacheln für jeden Bereich */
#intro{position:fixed;inset:0;z-index:60;background:#f6dccb;display:flex;align-items:center;justify-content:center}
#intro video{width:100%;height:100%;object-fit:cover}
@media (orientation:portrait){#intro video{height:64vh}}
#intro .go{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);border:0;cursor:pointer;white-space:nowrap;
  font-family:var(--display);font-weight:800;font-size:clamp(24px,5vw,34px);color:#fff;background:var(--pink);border-radius:999px;padding:12px 34px;
  box-shadow:0 0 0 5px #fff,0 14px 30px -10px rgba(90,30,110,.6);animation:pulse 1.6s ease-in-out infinite}
#intro .skip{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));border:0;cursor:pointer;font:inherit;font-weight:800;font-size:15px;
  background:rgba(255,255,255,.85);color:var(--ink);border-radius:999px;padding:8px 16px}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}

.hero{position:relative;border-radius:28px;overflow:hidden;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:12px;
  padding:22px 14px 14px;background:#f6dccb url("bilder/zimmer.jpg") center 30%/cover;box-shadow:0 16px 34px -20px rgba(90,30,110,.55)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.5))}
.hero .logo-row{position:relative;display:flex;align-items:center;justify-content:center;gap:2px;width:100%}
.hero .logo-big{position:relative;width:min(380px,72%);height:auto;filter:drop-shadow(0 8px 14px rgba(90,30,110,.3));animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.03)}}
.hero .friends{position:relative;width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.hero .ela{flex:1;min-width:0}
.hero .bubble{margin-bottom:14px;max-width:380px}
.friend{flex:none;border:0;padding:4px;cursor:pointer;border-radius:50%;background:var(--rainbow);box-shadow:0 8px 18px -8px rgba(90,30,110,.6)}
.hero .friend img,.hero .friend video{display:block;width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid #fff;filter:none}
.friend.hop{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@media (max-width:600px){.hero{min-height:300px}.hero .friend img,.hero .friend video{width:62px;height:62px}.hero .bubble{font-size:15px;margin-bottom:8px}}
@media (prefers-reduced-motion:reduce){#intro .go,.hero .logo-big,.friend.hop{animation:none}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:#fff;border-radius:28px;padding:20px 16px 18px;
  background:var(--c);box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 14px 28px -18px rgba(90,30,110,.6);transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .pic{width:150px;height:110px;border-radius:20px;background:#fff;display:grid;place-items:center;overflow:hidden}
.tile .pic img{max-width:90%;max-height:90%}
.tile b{font-family:var(--display);font-weight:800;font-size:32px;line-height:1}
.tile small{font-weight:800;font-size:15px;opacity:.95;text-align:center}
.tile.soon{filter:saturate(.55);cursor:default}
.tile.soon:hover{transform:none}
.badge{position:absolute;top:12px;right:12px;background:var(--yellow);color:var(--ink);font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px}
.mini-abc{font-family:var(--display);font-weight:800;font-size:56px;color:var(--red);line-height:1;letter-spacing:2px}
.mini-abc span:nth-child(2){color:var(--yellow)} .mini-abc span:nth-child(3){color:var(--blue)}
.dots{display:grid;grid-template-columns:repeat(3,28px);gap:8px}
.dots i{width:28px;height:28px;border-radius:50%}
.mem-ico{display:flex;gap:8px;align-items:center}
.mini-sticker{display:flex;align-items:center}
.mini-sticker img{width:48px;height:48px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--yellow);margin:0 -2px}
.mini-sticker img:nth-child(1){transform:rotate(-10deg)} .mini-sticker img:nth-child(2){transform:translateY(-8px);z-index:1;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--pink)} .mini-sticker img:nth-child(3){transform:rotate(9deg);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--purple)}
.mini-tueren{position:relative;display:flex;gap:5px;align-items:flex-end}
.mini-tueren img{height:58px;width:auto;filter:drop-shadow(0 3px 3px rgba(58,36,64,.3))}
.mini-tueren b{position:absolute;right:-8px;top:-12px;font-size:26px;font-family:var(--display);font-weight:800;color:var(--purple);line-height:1}
.bye-box{display:flex;justify-content:center}
.bye{background:#fff;color:var(--pink);font-family:var(--display);font-size:20px;box-shadow:inset 0 0 0 3px var(--pink)}
.mem-ico img,.mem-ico b{width:62px;height:62px;border-radius:12px;box-shadow:0 0 0 3px var(--orange)}
.mem-ico b{display:grid;place-items:center;font-family:var(--display);font-size:40px;color:var(--orange);background:#fff}
.mini-spur{position:relative;display:flex;align-items:center;gap:2px}
/* Numbers-Kachel: halb nachgespurte 2 + zwei Enten zum Zählen (Zählen und Nachspuren) – bewusst ohne Bewegung */
.mini-zahl{display:flex;align-items:center;gap:6px}
.mini-zahl svg{width:64px;height:86px}
.mini-zahl .enten{display:flex;flex-direction:column;gap:4px}
.mini-zahl .enten img{width:40px;height:40px;object-fit:contain;border-radius:10px;box-shadow:0 0 0 3px var(--green);background:#fff}
.mini-spur svg{width:82px;height:82px}
.mini-spur img{width:54px;height:54px;object-fit:contain;border-radius:14px;box-shadow:0 0 0 3px var(--red);background:#fff;transform:rotate(8deg) translateY(-8px);animation:apfel-hupf 2.4s ease-in-out infinite}
@keyframes apfel-hupf{0%,100%{transform:rotate(8deg) translateY(-8px)}40%{transform:rotate(-4deg) translateY(-18px)}60%{transform:rotate(6deg) translateY(-4px)}}
/* Kürbis (Malbuch) und Bär (Memory) hüpfen sanft wie der Apfel beim Nachspuren – leicht versetzt, damit nicht alle im Takt wackeln */
.tile .pic img.hupf{animation:kachel-hupf 2.6s ease-in-out infinite;transform-origin:50% 90%}
.tile .pic img.hupf.spaet{animation-delay:-1.3s;animation-duration:2.9s}
@keyframes kachel-hupf{0%,100%{transform:rotate(-4deg) translateY(0)}40%{transform:rotate(4deg) translateY(-9px)}60%{transform:rotate(-2deg) translateY(-2px)}}
/* Sticker: nur der mittlere hüpft (er sitzt schon etwas höher, daher eigene Bewegung) */
.mini-sticker img:nth-child(2){animation:sticker-hupf 3.1s ease-in-out infinite;animation-delay:-.7s}
@keyframes sticker-hupf{0%,100%{transform:translateY(-8px) rotate(0)}40%{transform:translateY(-16px) rotate(-6deg)}60%{transform:translateY(-6px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.mini-spur img,.tile .pic img.hupf,.mini-sticker img:nth-child(2){animation:none}}
.fuss .version{font-size:11px;opacity:.6}
</style>
</head>
<body>
<!-- Intro: Video läuft stumm, nach "Let's go!" mit Ton. Pro Besuch nur einmal (sessionStorage). -->
<div id="intro" hidden>
  <video id="intro-vid" muted loop playsinline preload="auto"></video>
  <button class="skip" id="intro-skip" type="button" data-t="intro_skip"></button>
  <button class="go" id="intro-go" type="button" data-t="intro_go"></button>
</div>

<div class="app">
  <header class="top">
    <h1 style="font-size:clamp(20px,3vw,26px)" data-t="home_title"></h1>
    <div class="lang" id="lang"></div>
    <div class="stars" data-t-label="stars"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg><span id="stars-n">0</span></div>
  </header>

  <section class="hero">
    <div class="logo-row">
      <img class="logo-big" src="bilder/logo.png" alt="Ela's Magic World – Draw, Learn, Play">
    </div>
    <div class="friends">
      <div class="ela">
        <button class="friend" id="ela-friend" type="button" aria-label="Ela"><img src="bilder/ela-rund.png" alt=""></button>
        <div class="bubble" id="bubble" role="status" data-t="home_hello"></div>
      </div>
    </div>
  </section>

  <nav class="tiles" aria-label="Areas">
    <a class="tile" href="malbuch.html?v=73" style="--c:var(--pink)">
      <div class="pic"><img class="hupf" src="bilder/halloween/P-Pumpkin.png" alt=""></div>
      <b data-t="t_malbuch"></b><small data-t="t_malbuch_s"></small>
    </a>
    <a class="tile" href="abc.html?v=73" style="--c:var(--purple)">
      <div class="pic"><div class="mini-abc"><span>A</span><span>B</span><span>C</span></div></div>
      <b data-t="t_abc"></b><small data-t="t_abc_s"></small>
    </a>
    <a class="tile" href="schreiben.html?v=73" style="--c:var(--orange)">
      <div class="pic"><div class="mini-spur"><svg viewBox="0 0 100 100" aria-hidden="true">
        <defs><linearGradient id="rb" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#3d8ef0"/><stop offset=".5" stop-color="#4cbb5c"/><stop offset="1" stop-color="#e8459b"/></linearGradient></defs>
        <path d="M18 88 L50 10 L82 88 M31 60 L69 60" fill="none" stroke="#efe6f7" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M50 10 L82 88 M31 60 L69 60" fill="none" stroke="#a48fbc" stroke-width="3.5" stroke-dasharray="6 6" stroke-linecap="round"/>
        <path d="M50 10 L18 88" fill="none" stroke="url(#rb)" stroke-width="12" stroke-linecap="round"/>
        <circle cx="50" cy="10" r="9" fill="#4cbb5c" stroke="#fff" stroke-width="2.5"/><text x="50" y="14.5" text-anchor="middle" font-family="Baloo 2,Nunito,sans-serif" font-weight="800" font-size="13" fill="#fff">1</text>
        <path d="M18 76l3.6 7.6 8.2 1.1-6 5.6 1.6 8-7.4-4-7.4 4 1.6-8-6-5.6 8.2-1.1z" fill="#fbbd23" stroke="#fff" stroke-width="1.5"/>
      </svg><img src="bilder/abc/A-Apple.jpg" alt=""></div></div>
      <b data-t="t_schreiben"></b><small data-t="t_schreiben_s"></small>
    </a>
    <a class="tile" href="farben.html?v=73" style="--c:var(--blue)">
      <div class="pic"><div class="dots"><i style="background:#f05252"></i><i style="background:#f7882f"></i><i style="background:#fbbd23"></i><i style="background:#4cbb5c"></i><i style="background:#3d8ef0"></i><i style="background:#8b5cf6"></i></div></div>
      <b data-t="t_farben"></b><small data-t="t_farben_s"></small>
    </a>
    <a class="tile" href="memory.html?v=73" style="--c:var(--orange)">
      <div class="pic"><div class="mem-ico"><img class="hupf spaet" src="bilder/abc/B-Bear.jpg" alt=""><b>B</b></div></div>
      <b data-t="t_memory"></b><small data-t="t_memory_s"></small>
    </a>
    <a class="tile" href="zahlen.html?v=73" style="--c:var(--green)">
      <div class="pic"><div class="mini-zahl"><svg viewBox="-8 -12 86 124" aria-hidden="true">
        <defs><linearGradient id="rb2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8459b"/><stop offset=".5" stop-color="#4cbb5c"/><stop offset="1" stop-color="#3d8ef0"/></linearGradient></defs>
        <path d="M8 25 C10 -6 62 -6 62 26 C62 50 30 70 8 100 L64 100" fill="none" stroke="#efe6f7" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 100 L64 100" fill="none" stroke="#a48fbc" stroke-width="3.5" stroke-dasharray="6 6" stroke-linecap="round"/>
        <path d="M8 25 C10 -6 62 -6 62 26 C62 50 30 70 8 100" fill="none" stroke="url(#rb2)" stroke-width="12" stroke-linecap="round"/>
        <circle cx="8" cy="25" r="9" fill="#4cbb5c" stroke="#fff" stroke-width="2.5"/><text x="8" y="29.5" text-anchor="middle" font-family="Baloo 2,Nunito,sans-serif" font-weight="800" font-size="13" fill="#fff">1</text>
      </svg><span class="enten"><img src="bilder/zahlen/ente.jpg" alt=""><img src="bilder/zahlen/ente.jpg" alt=""></span></div></div>
      <b data-t="t_zahlen"></b><small data-t="t_zahlen_s"></small>
    </a>
    <a class="tile" href="tueren.html?v=73" style="--c:var(--purple)">
      <div class="pic"><div class="mini-tueren"><img src="bilder/tueren/tuer-rot.webp" alt=""><img src="bilder/tueren/tuer-gelb.webp" alt=""><img src="bilder/tueren/tuer-blau.webp" alt=""><b>?</b></div></div>
      <b data-t="t_tueren"></b><small data-t="t_tueren_s"></small>
    </a>
    <a class="tile" href="sticker.html?v=73" style="--c:var(--pink)">
      <div class="pic"><div class="mini-sticker"><img src="bilder/halloween/bunt/P-Pumpkin.jpg" alt=""><img src="bilder/abc/B-Bear.jpg" alt=""><img src="bilder/halloween/bunt/B-Bat.jpg" alt=""></div></div>
      <b data-t="t_sticker"></b><small data-t="t_sticker_s"></small>
    </a>
  </nav>

  <div class="bye-box"><button class="btn bye" id="bye" type="button">👋 <span data-t="bye"></span></button></div>

  <footer class="fuss">
    <p data-t="f_safe"></p>
    <p><a href="info.html?v=73" data-t="f_parents"></a></p>
    <p class="version">v73</p>
  </footer>
</div>
<script src="gemeinsam.js?v=73"></script>
<script src="daten.js?v=73"></script>
<script>
document.querySelectorAll(".tile.soon").forEach(tile => tile.addEventListener("click", e => {
  e.preventDefault(); say(t("home_soon", { x: t(tile.dataset.soon) }));
}));
/* Im Oktober: Hexen-Ela (Halloween-Look), sonst die normale Ela */
const halloween = new Date().getMonth() === 9;
const HALLO = halloween ? "hw_hello" : "home_hello";
let elaClip = null;
if (halloween) {
  // Hexen-Ela im Kreis: Standbild, sie schaut nach vorn (das "schaut zu"-Video blickte zur Seite, sah im Kreis komisch aus).
  // Beim Antippen sagt sie "Hallo" als kleines Video mit ihrer Stimme, danach wieder das Standbild.
  elaClip = document.createElement("video");
  Object.assign(elaClip, { poster: "bilder/ela-hexe-rund.jpg", playsInline: true });
  elaClip.setAttribute("playsinline", ""); elaClip.setAttribute("aria-hidden", "true");
  document.querySelector("#ela-friend img").replaceWith(elaClip);
  elaClip.addEventListener("ended", () => { elaClip.removeAttribute("src"); elaClip.load(); });
  document.querySelector(".hero").style.backgroundImage = 'url("bilder/zimmer-halloween.jpg")';   // Halloween-Zimmer
  say(t(HALLO));
}
// Keine Text-Meldung "You have 55 stars" – die Kinder können noch nicht lesen; die Sterne zeigt oben rechts das Sternchen-Feld.

/* Ela spricht, wenn man sie antippt */
function hop(el){ el.classList.remove("hop"); void el.offsetWidth; el.classList.add("hop"); }
document.getElementById("ela-friend").onclick = e => {
  hop(e.currentTarget); say(t(HALLO));
  if (!elaClip) return speak(t(HALLO));
  try { speechSynthesis.cancel(); } catch(err){}
  Object.assign(elaClip, { src: "bilder/ela-hexe-hallo.mp4", muted: false, loop: false });
  const p = elaClip.play(); if (p && p.catch) p.catch(() => speak(t(HALLO)));
};
let byeNr = 0;
/* Abschied: "Bye-bye, Magic World! See you next time!" mit Elas Stimme, Ela winkt */
document.getElementById("bye").onclick = () => {
  hop(document.getElementById("ela-friend"));
  say(t("bye_text"));
  // abwechselnd "Bye-bye, Magic World! See you next time!" und "Bye-bye, see you soon!"
  byeNr = (byeNr || 0) + 1;
  if (LANG === "en") elaSagt(byeNr % 2 ? STIMMEN.tschuess : STIMMEN.tschuess2, t("bye_text")); else speak(t("bye_text"));
};

/* Intro-Video: einmal pro Besuch, nicht bei jeder Rückkehr zur Startseite */
const intro = document.getElementById("intro"), vid = document.getElementById("intro-vid");
let introGesehen = false;
try { introGesehen = sessionStorage.getItem("ela-intro") === "1"; } catch(e){}
function introZu(){
  if (intro.hidden) return;
  intro.hidden = true;
  try { vid.pause(); sessionStorage.setItem("ela-intro", "1"); } catch(e){}
}
// Oktober: Hexen-Ela zaubert Glitzer ins Zimmer, sonst das Logo-Video
// Oktober: Logo im Halloween-Zimmer, sonst Logo in Elas Zimmer
const introListe = halloween ? ["bilder/intro-halloween"] : ["bilder/intro"];
let introNr = 0, introDatei = introListe[0];
vid.addEventListener("ended", () => {
  if (++introNr >= introListe.length) return introZu();
  introDatei = introListe[introNr]; vid.poster = introDatei + ".jpg"; vid.src = introDatei + ".mp4";
  const p = vid.play(); if (p && p.catch) p.catch(introZu);
});
vid.addEventListener("error", introZu);
if (!introGesehen) {   // Video nur laden, wenn das Intro auch gezeigt wird
  intro.hidden = false;
  vid.poster = introDatei + ".jpg"; vid.src = introDatei + ".mp4";
  const p = vid.play(); if (p && p.catch) p.catch(() => {});
}
document.getElementById("intro-skip").onclick = introZu;
document.getElementById("intro-go").onclick = e => {
  e.currentTarget.hidden = true;
  vid.loop = false; vid.muted = false; vid.currentTime = 0;
  const p = vid.play(); if (p && p.catch) p.catch(introZu);
};
</script>
</body>
</html>
