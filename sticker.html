<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Stickers – Ela's Magic World</title>
<link rel="icon" href="bilder/ela-rund.png">
<link rel="stylesheet" href="schriften/schriften.css">
<link rel="stylesheet" href="gemeinsam.css?v=82">
<style>
/* Sticker-Album: alle 5 Sterne ein Sticker (STICKER in daten.js). Ohne Lesen verständlich: Sticker, leere Plätze mit "?",
   oben 5 Sternchen-Plätze = wie weit es bis zum nächsten Sticker ist. */
.top h1{color:var(--pink)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.main .ela{order:-1}}
.weiter{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 0 16px}
.weiter svg{width:clamp(34px,8vw,46px);height:auto}
.weiter .voll{fill:var(--yellow);stroke:#e0a800;stroke-width:1.2}
.weiter .leer{fill:#f3e6ee;stroke:#e6cfdc;stroke-width:1.2}
.weiter .naechster img{width:86%;height:86%;object-fit:contain;filter:brightness(0);opacity:.15}
.weiter .pfeil{font-family:var(--display);font-weight:800;font-size:30px;color:var(--muted);margin:0 4px}
.weiter .naechster{width:clamp(46px,11vw,60px);aspect-ratio:1;border-radius:50%;background:#fff;border:3px dashed #e6cfdc;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:26px;color:#e6cfdc}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(84px,22vw,120px),1fr));gap:clamp(10px,2.5vw,18px)}
.platz{aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.platz.zu{background:#fff;border:3px dashed #e6cfdc;font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);color:#e6cfdc}
.platz.auf{background:#fff;box-shadow:0 0 0 5px #fff,0 0 0 8px var(--c,var(--yellow)),0 10px 16px -8px rgba(58,36,64,.45);transform:rotate(var(--r,0deg));cursor:pointer;border:0;padding:0}
.platz.schatten img{width:86%;height:86%;object-fit:contain;filter:brightness(0);opacity:.13}
.platz.auf img{width:92%;height:92%;object-fit:contain;border-radius:50%}
.platz.neu{animation:neu-hopp 1s ease-in-out 3}
@keyframes neu-hopp{0%,100%{transform:rotate(var(--r,0deg)) scale(1)}50%{transform:rotate(0) scale(1.15)}}
.platz.auf:active{transform:scale(.94)}
@media (prefers-reduced-motion:reduce){.platz.neu{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="home" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-t="start"></span></a>
    <img class="logo" src="bilder/logo.png" alt="Ela's Magic World">
    <h1 data-t="t_sticker"></h1>
    <div class="lang" id="lang"></div>
    <div class="stars" data-t-label="stars"><svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/></svg><span id="stars-n">0</span></div>
  </header>

  <div class="main">
    <section class="card">
      <div class="weiter" id="weiter" aria-hidden="true"></div>
      <div class="album" id="album"></div>
    </section>
    <aside class="ela">
      <img class="round tippbar" id="ela-tipp" src="bilder/ela-rund.png" alt="Ela">
      <div class="bubble" id="bubble" role="status" data-t="st_hint"></div>
    </aside>
  </div>
</div>

<script src="gemeinsam.js?v=82"></script>
<script src="daten.js?v=82"></script>
<script>
const STERN = '<path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21l1.5-7L2 9.3l7-.8z"/>';
const RAHMEN = ["#fbbd23","#e8459b","#8b5cf6","#3d8ef0","#4cbb5c","#f7882f"];
const n = sterne(), frei = Math.min(STICKER.length, Math.floor(n / STICKER_ALLE));
const gesehen = parseInt(store.get("ela-sticker-gesehen") || "0", 10) || 0;

/* Oben: 5 Sternchen-Plätze (gefüllt = schon gesammelt) → leerer Sticker-Platz = so weit ist es bis zum nächsten Sticker */
const weiter = document.getElementById("weiter");
if (frei < STICKER.length) {
  const voll = n % STICKER_ALLE;
  for (let i = 0; i < STICKER_ALLE; i++) weiter.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 24 24" class="${i < voll ? "voll" : "leer"}">${STERN}</svg>`);
  const naechster = STICKER[frei];   // der nächste Sticker – Sterne schon als Silhouette, sonst "?"
  weiter.insertAdjacentHTML("beforeend", `<span class="pfeil">→</span><span class="naechster">${naechster.includes("/sterne/") ? `<img src="${naechster}" alt="">` : "?"}</span>`);
}

/* Album: freie Sticker (leicht schräg, bunter Rand), danach leere Plätze mit "?" */
const album = document.getElementById("album");
STICKER.forEach((bild, i) => {
  if (i < frei) {
    const b = document.createElement("button"); b.type = "button"; b.className = "platz auf";
    b.style.setProperty("--r", ((i * 37) % 17 - 8) + "deg"); b.style.setProperty("--c", RAHMEN[i % RAHMEN.length]);
    b.innerHTML = `<img src="${bild}" alt="">`;
    if (i >= gesehen) b.classList.add("neu");               // seit dem letzten Besuch neu dazugekommen
    b.onclick = () => stickerNeu(bild);                      // antippen = groß ansehen
    album.appendChild(b);
  } else {
    // Sterne (durchsichtig) als graue Silhouette – man sieht schon die Form; andere Sticker als "?"
    album.insertAdjacentHTML("beforeend", bild.includes("/sterne/")
      ? `<div class="platz zu schatten"><img src="${bild}" alt=""></div>` : `<div class="platz zu">?</div>`);
  }
});
store.set("ela-sticker-gesehen", String(frei));
if (frei > gesehen) { sternRegen(); say(t("st_new")); if (LANG === "en") elaSagt([zufall(STIMMEN.lob)]); }

/* Ela antippen: sie lobt mit ihrer Stimme */
document.getElementById("ela-tipp").onclick = () => elaSagt([zufall(STIMMEN.lob)]);
</script>
</body>
</html>
